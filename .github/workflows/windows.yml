name: Windows

on: [push, pull_request]

jobs:
  msbuild:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        # ClangCL OOMs on the unity-style dllmain TU after DX11/ImGui headers; MSVC covers CI.
        toolset: [MSVC]
        configuration: [Debug, Release]
    steps:
    - uses: actions/checkout@v6
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
    # vcxproj defaults to v145 (VS 2026 locally). CI runners use v143 (VS 2022).
    - name: Set toolset
      run: echo "toolset=/p:PlatformToolset=v143" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Build
      shell: cmd
      run: msbuild Source\AimSync.vcxproj /p:Platform=x64 /p:Configuration=${{ matrix.configuration }} ${{ env.toolset }}

  cmake:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        toolset: [MSVC]
        configuration: [Debug, Release]
    steps:
    - uses: actions/checkout@v6
    - name: configure
      run: cmake -Werror=dev -D ENABLE_TESTS= -D CMAKE_COMPILE_WARNING_AS_ERROR=1 -A x64 -B build
    - name: build source
      run: cmake --build build --target AimSync --config ${{ matrix.configuration }}
